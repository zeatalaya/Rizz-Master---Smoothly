version: "3.8"

# Production config for Phala Cloud / real dstack TDX hardware.
# The dstack runtime provides /var/run/dstack.sock automatically.

services:
  rizz-master:
    build: .
    ports:
      - "3069:3069"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
